[workspace]
members = ["cli"]
default-members = ["."]
exclude = ["examples/esp32c3-unifi-display"]
resolver = "2"

[package]
name = "unifi"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Allocation-free UniFi API client for embedded Rust"
license = "MIT"

[features]
default = []
serde = ["dep:serde", "dep:serde-json-core", "heapless/serde"]
std = ["dep:http", "dep:url"]
blocking = ["std", "dep:reqwest", "dep:rustls", "reqwest/blocking"]
tokio = ["std", "dep:reqwest", "dep:rustls", "dep:bytes"]
async_std = ["std", "dep:rustls", "dep:async-std", "dep:futures-rustls", "dep:rustls-native-certs", "dep:embedded-io-adapters"]

[dependencies]
reqwless = { version = "0.14", default-features = false }
heapless = "0.9"
embedded-io = "0.7"
embedded-io-async = "0.7"
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
serde-json-core = { version = "0.6", default-features = false, optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"], optional = true }
async-std = { version = "1.13", optional = true }
futures-rustls = { version = "0.26", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
embedded-io-adapters = { version = "0.7", features = ["futures-03"], optional = true }
http = { version = "1", optional = true }
url = { version = "2", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rcgen = "0.14"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "pipe", "event", "time", "process"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
