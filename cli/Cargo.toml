[package]
name = "unifi-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[dependencies]
unifi = { path = ".." }
rustix = { version = "1.1", default-features = false, features = ["fs", "net", "stdio", "process", "rand", "time", "pipe", "event", "termios"] }
argtokens = { version = "0.5", default-features = false, features = ["str"] }
heapless = "0.9"
embedded-io = "0.7"
embedded-io-async = "0.7"

embedded-tls = { version = "0.19", default-features = false, features = ["rustpki", "ed25519", "p384"] }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }

[[bin]]
name = "unifi"
path = "src/main.rs"
test = false
bench = false
