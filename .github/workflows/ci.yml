name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  native:
    name: Native tests and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned stable Rust
        if: hashFiles('Cargo.toml') != ''
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: hashFiles('Cargo.lock') != ''
        with:
          shared-key: native
          cache-on-failure: true
      - name: Bootstrap or verify workspace
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.toml ]]; then
            echo "Bootstrap main: implementation arrives in a pull request."
            exit 0
          fi
          cargo fmt --all --check
          python3 tools/generate.py --check
          cargo test --locked
          cargo test --locked --all-features
          cargo clippy --locked -p unifi --all-targets --all-features -- -D warnings
          cargo clippy --locked -p unifi-cli --bin unifi -- -D warnings
          cargo build --locked -p unifi-cli --timings
          python3 -m venv /tmp/unifi-test-env
          /tmp/unifi-test-env/bin/pip install --disable-pip-version-check -r tools/requirements-test.txt
          /tmp/unifi-test-env/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/check-no-allocator.py target/debug/unifi

  embedded:
    name: Bare metal (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.99.1", "1.91.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain and bare-metal target
        if: hashFiles('Cargo.toml') != ''
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --target riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: hashFiles('Cargo.lock') != ''
        with:
          shared-key: embedded-${{ matrix.rust }}
          cache-on-failure: true
      - name: Bootstrap or verify no_std feature sets
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.toml ]]; then
            echo "Bootstrap main: implementation arrives in a pull request."
            exit 0
          fi
          cargo +${{ matrix.rust }} check --locked --lib --target riscv32imac-unknown-none-elf
          cargo +${{ matrix.rust }} check --locked --lib --all-features --target riscv32imac-unknown-none-elf
